<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Publicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #6a7680;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .delete-container {
            background-color: rgb(73, 84, 89);
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="delete-container text-center">
        <h2>¿Eliminar esta publicación?</h2>
        <p><strong>{{ publicacion.titulo }}</strong></p>
        {% if publicacion.imagen %}
            <img src="{{ publicacion.imagen.url }}" alt="Imagen de la publicación" class="img-fluid mb-3" style="max-height: 200px; border-radius: 8px;">
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_publicaciones' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
